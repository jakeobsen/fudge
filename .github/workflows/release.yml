name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Test
        run: make test

      - name: Build the app
        run: make app CONFIG=release VERSION="$GITHUB_REF_NAME"

      - name: Zip the app
        run: ditto -c -k --keepParent build/Fudge.app "build/Fudge-$GITHUB_REF_NAME.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Fudge-${{ github.ref_name }}
          path: build/Fudge-${{ github.ref_name }}.zip
          if-no-files-found: error
