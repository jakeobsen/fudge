name: Release

# A v* tag becomes a GitHub Release with the app's disk image, signed with the Developer ID identity, notarized and
# stapled (scripts/release.sh). Tags are pushed only with the maintainer's explicit permission. The build job runs the
# repo's code with a read-only token; only the publish job, which runs none of it, may write. Run by hand
# (workflow_dispatch), it's the dry run: it builds, signs and notarizes, the disk image is an artifact, and nothing is
# published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    # The signing secrets are the release environment's, which only mainline and v* tags may use, so a workflow on
    # any other branch, one an unreviewed branch adds included, can't read them.
    environment: release
    permissions:
      contents: read
    outputs:
      signing: ${{ steps.release.outputs.signing }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check the tag
        if: github.event_name == 'push'
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eqx 'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?'; then
            echo "::error::$TAG isn't v and a semantic version (v1.2.0, v1.2.0-rc.1)"
            exit 1
          fi

      # The whole history, so the build number (`git rev-list --count HEAD`) counts every commit and a run by hand
      # finds the tags `git describe` names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # No setup-node: the Makefile downloads the Node.js Fudge bundles, checks it against its pinned checksum, and
      # runs every Node step with it, the release build's included.

      # Well above a normal run (4 to 5 minutes), so a hang fails the job instead of holding a runner (FUD-153).
      - name: Test
        timeout-minutes: 20
        run: make test

      # The signing secrets reach this step only, and the script builds with none of them in its environment. Without
      # them a tag still makes a release, signed ad hoc and saying so (a fork has none); a run by hand, which is there
      # to try them, fails instead. A tag's build names it (--tag), and the Makefile checks it's on this commit; a run
      # by hand takes the version `git describe` gives the commit, as `make app` does.
      - name: Build, sign and notarize the disk image
        id: release
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            scripts/release.sh --tag "$TAG" --ad-hoc-without-secrets
          else
            scripts/release.sh
          fi

      - name: Checksum
        working-directory: build
        run: |
          for dmg in Fudge-*.dmg; do shasum -a 256 "$dmg" > "$dmg.sha256"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            build/Fudge-*.dmg
            build/Fudge-*.dmg.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      SIGNING: ${{ needs.build.outputs.signing }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eqx 'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?'; then
            echo "::error::$TAG isn't v and a semantic version"
            exit 1
          fi
          # A tag with a pre-release suffix (v1.2.0-rc.1) is a pre-release.
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          if [ "$SIGNING" = developer-id ]; then
            notes="Fudge is signed with a Developer ID and notarized by Apple: the first time you open it, macOS asks once, as for any app downloaded from the internet."
          else
            notes="This build is signed ad hoc and isn't notarized, so macOS blocks it the first time: open it, then go to System Settings → Privacy & Security and click Open Anyway (on macOS 14, Control-click Fudge and choose Open instead)."
          fi
          gh release create "$TAG" release/* --repo "$REPO" --verify-tag --title "$TAG" \
            --notes "$notes" --generate-notes "${prerelease[@]}"
