name: CI

on:
  push:
    branches: [mainline]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No setup-node: the Makefile downloads the Node.js Fudge bundles, checks it against its pinned checksum, and
      # runs every Node step with it.
      - name: Lint
        timeout-minutes: 20
        run: make lint

      # Well above a normal run (4 to 5 minutes), so a hang fails the job instead of holding a runner (FUD-153).
      - name: Test
        timeout-minutes: 20
        run: make test
