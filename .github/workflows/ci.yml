name: CI

on:
  push:
    branches: [mainline]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No setup-node: the Makefile downloads the Node.js Fudge bundles, checks it against its pinned checksum, and
      # runs every Node step with it.
      - name: Lint
        run: make lint

      - name: Test
        run: make test
